<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DayliDo - Daily Todo List</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link id="manifest-placeholder" rel="manifest">
    <meta name="theme-color" content="#0b1329">
</head>
<body class="bg-[#0b1329] text-slate-100 font-sans select-none min-h-screen flex flex-col justify-between">
    <div class="w-full max-w-md mx-auto p-3 flex flex-col gap-3 pb-20">
        <!-- Header Profile -->
        <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-3 shadow-lg flex items-center justify-between">
            <div>
                <div class="flex items-center gap-1.5">
                    <h1 id="user-name-display" class="text-sm font-bold text-white tracking-wide">Hey, DK!</h1>
                    <button onclick="editUserName()" class="text-xs text-amber-400 hover:text-amber-300">✏️</button>
                </div>
                <p id="current-date-text" class="text-[10px] text-slate-400 mt-0.5">-</p>
            </div>
            <div class="flex items-center gap-2">
                <div id="day-of-year-text" class="text-[9px] bg-slate-800 text-slate-400 px-2 py-0.5 rounded-full font-mono">-</div>
                <div id="user-avatar" class="w-8 h-8 rounded-full bg-emerald-600/30 border border-emerald-500/50 flex items-center justify-center font-bold text-emerald-400 text-xs">D</div>
            </div>
        </div>

        <!-- Progress Card -->
        <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-3 shadow-lg flex flex-col gap-2">
            <div class="flex items-center justify-between text-xs">
                <span id="day-title" class="font-bold text-emerald-400 tracking-wider text-[11px]">PRODUKTIVITAS</span>
                <span id="percent-text" class="font-mono font-bold text-emerald-400">0%</span>
            </div>
            <div class="w-full bg-slate-800 rounded-full h-2 overflow-hidden">
                <div id="progress-bar" class="bg-gradient-to-r from-emerald-600 to-emerald-400 h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
            <div class="flex items-center justify-between text-[10px] text-slate-400">
                <span id="tasks-count-text">0 dari 0 tugas selesai</span>
                <button onclick="resetCurrentDay()" class="hover:text-emerald-400 transition underline">Reset Hari Ini</button>
            </div>
        </div>

        <!-- Days Bar -->
        <div class="bg-slate-900/60 border border-slate-800/80 rounded-xl p-1.5 grid grid-cols-7 gap-1" id="days-bar"></div>

        <!-- Tab 1: Tugas -->
        <div id="tab-tasks" class="tab-page flex flex-col gap-2">
            <div id="todo-list" class="flex flex-col gap-2"></div>
            <button onclick="openAddModal()" class="w-full bg-emerald-600/20 border border-emerald-500/40 hover:bg-emerald-600/30 text-emerald-400 font-semibold py-2.5 rounded-xl text-xs flex items-center justify-center gap-1.5 transition shadow-sm mt-1">
                + Tambah Tugas Baru
            </button>
        </div>

        <!-- Tab 2: Kalender -->
        <div id="tab-calendar" class="tab-page hidden flex flex-col gap-3">
            <div class="bg-slate-900/80 border border-slate-800 rounded-xl p-3 flex flex-col gap-2">
                <label class="text-xs font-semibold text-slate-300">Pilih Tanggal Agenda</label>
                <input type="date" id="calendar-date-picker" onchange="onCalendarDateChange()" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500">
            </div>
            <div class="bg-slate-900/80 border border-slate-800 rounded-xl p-3 flex flex-col gap-2">
                <div class="flex items-center justify-between">
                    <span id="calendar-selected-label" class="text-xs font-semibold text-emerald-400">Agenda Kegiatan</span>
                    <span id="calendar-task-count" class="text-[10px] bg-slate-800 px-2 py-0.5 rounded text-slate-400 font-mono">0 Kegiatan</span>
                </div>
                <div id="calendar-tasks-list" class="flex flex-col gap-1.5 mt-1"></div>
            </div>
        </div>

        <!-- Tab 3: Statistik -->
        <div id="tab-stats" class="tab-page hidden flex flex-col gap-3">
            <div class="bg-slate-900/80 border border-slate-800 rounded-xl p-3 flex flex-col gap-2">
                <div class="flex items-center justify-between">
                    <h2 class="text-xs font-bold text-white">Statistik Produktivitas</h2>
                    <select id="analytics-filter" onchange="renderStatsTab()" class="bg-slate-800 border border-slate-700 rounded px-2 py-1 text-[10px] text-white">
                        <option value="daily">Harian</option>
                        <option value="weekly">Mingguan</option>
                        <option value="monthly">Bulanan</option>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-2 mt-1">
                    <div class="bg-slate-800/60 p-2.5 rounded-lg border border-slate-700/50 flex flex-col">
                        <span class="text-[10px] text-slate-400">Rata-rata Selesai</span>
                        <span id="stat-avg-completion" class="text-base font-bold text-emerald-400 mt-0.5">0%</span>
                    </div>
                    <div class="bg-slate-800/60 p-2.5 rounded-lg border border-slate-700/50 flex flex-col">
                        <span class="text-[10px] text-slate-400">Total Tugas Selesai</span>
                        <span id="stat-total-done" class="text-base font-bold text-blue-400 mt-0.5">0</span>
                    </div>
                </div>
            </div>
            <div class="bg-slate-900/80 border border-slate-800 rounded-xl p-3 flex flex-col gap-2">
                <h3 class="text-xs font-semibold text-slate-300">Detail Kinerja Periode</h3>
                <div id="stats-detail-list" class="flex flex-col gap-1.5"></div>
            </div>
        </div>

        <!-- Tab 4: Pengaturan -->
        <div id="tab-settings" class="tab-page hidden flex flex-col gap-3">
            <div class="bg-slate-900/80 border border-slate-800 rounded-xl p-3 flex flex-col gap-2.5">
                <h2 class="text-xs font-bold text-white">Pengaturan Pengguna</h2>
                <div>
                    <label class="text-[11px] text-slate-400 block mb-1">Nama Pemilik</label>
                    <div class="flex gap-2">
                        <input type="text" id="settings-user-name" class="flex-1 bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none focus:border-emerald-500">
                        <button onclick="saveNameFromSettings()" class="bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-bold px-3 py-1.5 rounded-lg text-xs transition">Simpan</button>
                    </div>
                </div>
            </div>
            <div class="bg-slate-900/80 border border-slate-800 rounded-xl p-3 flex flex-col gap-2">
                <h2 class="text-xs font-bold text-white">Cadangan & Pemulihan Data</h2>
                <div class="flex gap-2 mt-1">
                    <button onclick="backupToInternalStorage()" class="flex-1 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 font-semibold py-2 rounded-lg text-xs transition text-center">Backup JSON</button>
                    <label class="flex-1 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 font-semibold py-2 rounded-lg text-xs transition text-center cursor-pointer">
                        Restore JSON
                        <input type="file" accept=".json" onchange="restoreFromInternalStorage(event)" class="hidden">
                    </label>
                </div>
            </div>
            <div class="bg-slate-900/80 border border-rose-900/50 rounded-xl p-3 flex flex-col gap-2">
                <h2 class="text-xs font-bold text-rose-400">Zona Bahaya</h2>
                <button onclick="resetAllData()" class="w-full bg-rose-600/20 hover:bg-rose-600/30 border border-rose-500/40 text-rose-400 font-semibold py-2 rounded-lg text-xs transition">Reset Semua Data ke Default</button>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-slate-900/95 backdrop-blur border-t border-slate-800 flex justify-around py-1.5 z-40 text-[10px]">
        <button onclick="switchTab('tasks')" id="nav-tasks" class="flex flex-col items-center justify-center text-emerald-400 font-medium w-1/4 py-1 transition">
            <span class="text-base leading-none mb-0.5">📋</span> Tugas
        </button>
        <button onclick="switchTab('calendar')" id="nav-calendar" class="flex flex-col items-center justify-center text-slate-400 hover:text-slate-200 font-medium w-1/4 py-1 transition">
            <span class="text-base leading-none mb-0.5">📅</span> Kalender
        </button>
        <button onclick="switchTab('stats')" id="nav-stats" class="flex flex-col items-center justify-center text-slate-400 hover:text-slate-200 font-medium w-1/4 py-1 transition">
            <span class="text-base leading-none mb-0.5">📊</span> Analitik
        </button>
        <button onclick="switchTab('settings')" id="nav-settings" class="flex flex-col items-center justify-center text-slate-400 hover:text-slate-200 font-medium w-1/4 py-1 transition">
            <span class="text-base leading-none mb-0.5">⚙️</span> Pengaturan
        </button>
    </nav>

    <!-- Modal Tambah & Edit -->
    <div id="add-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 w-full max-w-xs flex flex-col gap-3 shadow-xl">
            <h3 class="text-xs font-bold text-white">Tambah Tugas Baru</h3>
            <div class="flex flex-col gap-1">
                <label class="text-[11px] text-slate-400">Nama Tugas</label>
                <input type="text" id="new-task-title" placeholder="Contoh: Baca buku..." class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500">
            </div>
            <div class="flex flex-col gap-1">
                <label class="text-[11px] text-slate-400">Target Harian</label>
                <input type="number" id="new-task-target" min="1" value="1" class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500">
            </div>
            <div class="flex flex-col gap-1">
                <label class="text-[11px] text-slate-400">Frekuensi Tugas</label>
                <select id="new-task-freq" onchange="handleFreqChange('new')" class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500">
                    <option value="daily">Setiap Hari</option>
                    <option value="weekly">Mingguan</option>
                    <option value="monthly">Bulanan</option>
                    <option value="specific_date">Tanggal Spesifik</option>
                    <option value="custom_day">Kustom Hari</option>
                </select>
            </div>
            <div id="new-freq-extra" class="hidden flex flex-col gap-1"></div>
            <div class="flex gap-2 mt-1">
                <button onclick="closeAddModal()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold py-2 rounded-xl text-xs transition">Batal</button>
                <button onclick="saveNewTask()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-bold py-2 rounded-xl text-xs transition">Simpan</button>
            </div>
        </div>
    </div>

    <div id="edit-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 w-full max-w-xs flex flex-col gap-3 shadow-xl">
            <h3 class="text-xs font-bold text-white">Edit Tugas</h3>
            <input type="hidden" id="edit-task-id">
            <div class="flex flex-col gap-1">
                <label class="text-[11px] text-slate-400">Nama Tugas</label>
                <input type="text" id="edit-task-title" class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500">
            </div>
            <div class="flex flex-col gap-1">
                <label class="text-[11px] text-slate-400">Target Harian</label>
                <input type="number" id="edit-task-target" min="1" class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500">
            </div>
            <div class="flex flex-col gap-1">
                <label class="text-[11px] text-slate-400">Frekuensi</label>
                <select id="edit-task-freq" onchange="handleFreqChange('edit')" class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500">
                    <option value="daily">Setiap Hari</option>
                    <option value="weekly">Mingguan</option>
                    <option value="monthly">Bulanan</option>
                    <option value="specific_date">Tanggal Spesifik</option>
                    <option value="custom_day">Kustom Hari</option>
                </select>
            </div>
            <div id="edit-freq-extra" class="hidden flex flex-col gap-1"></div>
            <div class="flex gap-2 mt-1">
                <button onclick="closeEditModal()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold py-2 rounded-xl text-xs transition">Batal</button>
                <button onclick="saveEditTask()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-bold py-2 rounded-xl text-xs transition">Simpan</button>
            </div>
        </div>
    </div>

    <!-- SDK Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Skrip Aplikasi Modular -->
    <script src="js/config.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/tasks.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
